<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Julieta 🌼</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Georgia,'Times New Roman',serif
}
body{
  background:radial-gradient(circle at 50% 88%,#204b38 0,#111d31 48%,#050813 100%);
  color:#fff
}
.layer{position:absolute;inset:0;pointer-events:none}
#sky{z-index:1}
#decor{z-index:2}
#plants{z-index:6}
#petals{z-index:8}
#fx{z-index:9}

.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  animation:tw 1.5s infinite alternate
}
@keyframes tw{
  to{opacity:.15;transform:scale(.35)}
}

.box{
  position:absolute;
  z-index:15;
  left:50%;
  top:36%;
  transform:translate(-50%,-50%);
  width:min(88%,860px);
  text-align:center;
  text-shadow:0 3px 16px #000
}

h1{
  margin:0 0 14px;
  font-size:clamp(44px,8vw,80px);
  color:#ffe66e
}

#phrase{
  font-size:clamp(20px,3.1vw,33px);
  line-height:1.42;
  min-height:125px;
  opacity:0;
  transform:translateY(12px);
  transition:.8s
}
#phrase.show{opacity:1;transform:none}

button{
  border:0;
  border-radius:30px;
  padding:15px 28px;
  font-size:18px;
  background:#ffe460;
  color:#26321c;
  box-shadow:0 6px 22px #0009;
  cursor:pointer
}

.plant{
  position:absolute;
  bottom:0;
  width:68px;
  transform:translateX(-50%);
  transform-origin:50% 100%;
  animation:sway 3s ease-in-out infinite
}
.plant:nth-child(3n){animation-duration:3.7s}
.plant:nth-child(4n){animation-duration:2.5s}

@keyframes sway{
  0%{transform:translateX(-50%) rotate(-5deg)}
  35%{transform:translateX(-50%) rotate(3.5deg)}
  70%{transform:translateX(-50%) rotate(-3deg)}
  100%{transform:translateX(-50%) rotate(5deg)}
}

.stem{
  position:absolute;
  left:32px;
  bottom:0;
  width:4px;
  background:linear-gradient(#78ca5f,#2c7c3b);
  border-radius:5px;
  transform-origin:bottom;
  transform:scaleY(0);
  transition:transform .9s ease-out
}

.leaf{
  position:absolute;
  width:28px;
  height:14px;
  background:linear-gradient(135deg,#79cf60,#2e7a3c);
  border-radius:100% 0 100% 0;
  opacity:0;
  transition:opacity .45s ease .55s
}

.leaf1{left:5px;bottom:35%;transform:rotate(-25deg)}
.leaf2{right:2px;bottom:56%;transform:scaleX(-1) rotate(-25deg)}

.flower{
  position:absolute;
  left:34px;
  top:-18px;
  width:0;
  height:0;
  opacity:0;
  transform:scale(.18);
  transition:all .65s cubic-bezier(.2,.9,.2,1.35) 1s
}

.fp{
  position:absolute;
  left:-8px;
  top:-31px;
  width:16px;
  height:31px;
  background:linear-gradient(#ffd94b,#fff08b);
  transform-origin:8px 31px;
  border-radius:90% 90% 70% 70%;
  box-shadow:0 1px 2px #0003
}

.fc{
  position:absolute;
  left:-10px;
  top:-10px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#8a571c;
  box-shadow:0 0 9px #ffd43b
}

.plant.grow .stem{transform:scaleY(1)}
.plant.grow .leaf{opacity:1}
.plant.grow .flower{opacity:1;transform:scale(1)}

.fallpetal{
  position:absolute;
  color:#ffd94b;
  font-size:22px;
  animation:fall 6s linear forwards
}
@keyframes fall{
  to{transform:translate(110px,110vh) rotate(620deg);opacity:0}
}

.meteor,.comet{
  position:absolute;
  width:170px;
  height:2px;
  background:linear-gradient(90deg,#fff,transparent);
  filter:drop-shadow(0 0 6px #fff);
  animation:shoot 1.5s linear forwards
}

.comet{
  height:3px;
  background:linear-gradient(90deg,#9ce7ff,#fff,transparent);
  filter:drop-shadow(0 0 8px #8ad7ff)
}

@keyframes shoot{
  from{transform:translate(-20vw,-10vh) rotate(-28deg)}
  to{transform:translate(125vw,70vh) rotate(-28deg);opacity:0}
}

.spark{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  animation:pop 1.35s ease-out forwards
}

@keyframes pop{
  to{transform:translate(var(--dx),var(--dy));opacity:0}
}

.moon{
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbd2,#ffe89e 55%,#e7c15a 100%);
  box-shadow:0 0 35px #ffe9a6aa;
  top:8%;
  left:7%
}
</style>
</head>

<body>

<div id="sky" class="layer"></div>
<div id="decor" class="layer"></div>
<div id="plants" class="layer"></div>
<div id="petals" class="layer"></div>
<div id="fx" class="layer"></div>

<div class="box">
  <h1>Julieta 🌼</h1>
  <div id="phrase">Tengo un pequeño detalle para vos.</div>
  <button id="start">Tocá para comenzar</button>
</div>

<audio id="music" src="musica_flores.mp3" loop preload="auto"></audio>

<script>

const frases=[
"Un pequeño detalle para agradecerte la buena predisposición que siempre tuviste en mis clases.",
"Tu buena onda hizo que compartir las clases fuera mucho más lindo.",
"Seguí disfrutando y aprovechando esta hermosa etapa.",
"Que la primavera que se acerca te encuentre con muchos motivos para sonreír. 🌼",
"¡Feliz Semana del Estudiante, Julieta! 🌼"
];

const sky=document.querySelector('#sky');
const decor=document.querySelector('#decor');
const plants=document.querySelector('#plants');
const petals=document.querySelector('#petals');
const fx=document.querySelector('#fx');
const phrase=document.querySelector('#phrase');
const music=document.querySelector('#music');

const colores=[
'#8ad7ff',
'#ff9fd2',
'#c7a0ff',
'#ffffff',
'#72f1b8',
'#ffd84d',
'#ff8fab'
];

/* ESTRELLAS */
for(let i=0;i<145;i++){
 const s=document.createElement('i');
 s.className='star';
 const z=1+Math.random()*3;
 s.style.width=z+'px';
 s.style.height=z+'px';
 s.style.left=Math.random()*100+'%';
 s.style.top=Math.random()*78+'%';
 s.style.animationDelay=Math.random()*2+'s';
 sky.appendChild(s);
}

/* LUNA */
const luna=document.createElement('i');
luna.className='moon';
decor.appendChild(luna);

/* FLORES */
function crearFlor(i){

 const total=31;
 const x=2.5+(i%total)*(95/30);

 let altura=(i%2===0?150:92)+(i%5)*8+Math.random()*16;

 const planta=document.createElement('div');
 planta.className='plant';
 planta.style.left=x+'%';
 planta.style.height=altura+'px';

 const tallo=document.createElement('div');
 tallo.className='stem';
 tallo.style.height=altura+'px';

 const hoja1=document.createElement('div');
 hoja1.className='leaf leaf1';

 const hoja2=document.createElement('div');
 hoja2.className='leaf leaf2';

 const flor=document.createElement('div');
 flor.className='flower';

 for(let k=0;k<12;k++){
   const petalo=document.createElement('i');
   petalo.className='fp';
   petalo.style.transform=`rotate(${k*30}deg)`;
   flor.appendChild(petalo);
 }

 const centro=document.createElement('i');
 centro.className='fc';
 flor.appendChild(centro);

 planta.append(tallo,hoja1,hoja2,flor);
 plants.appendChild(planta);

 requestAnimationFrame(()=>{
   planta.classList.add('grow');
 });
}

function llenarCampo(){
 for(let i=0;i<31;i++){
   setTimeout(()=>crearFlor(i),i*85);
 }
}

/* METEORITOS */
function meteorito(tipo=0){

 const m=document.createElement('i');

 m.className=tipo%2?'comet':'meteor';
 m.style.top=(5+Math.random()*34)+'%';
 m.style.left='-20%';

 sky.appendChild(m);

 setTimeout(()=>m.remove(),1800);
}

/* PÉTALOS */
function lluviaPetalos(cantidad=18){

 for(let i=0;i<cantidad;i++){

   setTimeout(()=>{

     const p=document.createElement('i');

     p.className='fallpetal';
     p.textContent=i%3?'❋':'✦';

     p.style.left=Math.random()*100+'%';
     p.style.top='-6%';
     p.style.animationDuration=(4+Math.random()*3.5)+'s';

     petals.appendChild(p);

     setTimeout(()=>p.remove(),8000);

   },i*65);
 }
}

/* FUEGOS ARTIFICIALES */
function fuegos(cantidad=3){

 for(let b=0;b<cantidad;b++){

   setTimeout(()=>{

     const cx=12+Math.random()*76;
     const cy=7+Math.random()*33;

     const color=
     colores[Math.floor(Math.random()*colores.length)];

     for(let i=0;i<30;i++){

       const s=document.createElement('i');
       s.className='spark';

       const angulo=i*Math.PI/15;
       const radio=48+Math.random()*80;

       s.style.left=cx+'%';
       s.style.top=cy+'%';

       s.style.background=color;
       s.style.boxShadow='0 0 8px '+color;

       s.style.setProperty(
       '--dx',
       Math.cos(angulo)*radio+'px'
       );

       s.style.setProperty(
       '--dy',
       Math.sin(angulo)*radio+'px'
       );

       fx.appendChild(s);

       setTimeout(()=>s.remove(),1450);
     }

   },b*300);
 }
}

/* INICIO */
let indice=0;

document.querySelector('#start').onclick=function(){

 this.remove();

 music.currentTime=0;
 music.play().catch(()=>{});

 llenarCampo();

 meteorito(0);
 setTimeout(()=>meteorito(1),420);

 fuegos(2);

 setTimeout(mostrarFrase,700);
};

/* FRASES */
function mostrarFrase(){

 phrase.classList.remove('show');

 setTimeout(()=>{

   phrase.textContent=frases[indice];

   phrase.classList.add('show');

   lluviaPetalos(16+indice*2);

   meteorito(indice);
   setTimeout(()=>meteorito(indice+1),430);

   fuegos(2);

   indice++;

   if(indice<frases.length){

      setTimeout(mostrarFrase,4700);

   }else{

      setTimeout(()=>{

        lluviaPetalos(42);
        fuegos(6);

        for(let i=0;i<6;i++){
          setTimeout(()=>meteorito(i),i*400);
        }

      },3200);
   }

 },420);
}

</script>

</body>
</html>
